<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4</title>
</head>
<body>
    
    <fieldset>
        <center>
            <h1>Hotel Room Booking Form</h1>
            <label for="Name">Name :</label>
            <input type="text" name="name" id="name" placeholder="Enter your Name" >

            <br><br>

            <label for="Email">Email :</label>
            <input type="email" name="Email" id="Email" placeholder="Enter your Email">
            
            <br><br>
            
            <label for="phone">Phone :</label>
            <input type="number" name="phone" id="phone" placeholder="Enter your Number">
            
            <br><br>
            
            <label for="checkin">Check-in Date :</label>
            <input type="date" name="checkin" id="namecheckin">
            

            <br><br>
            
            <label for="checkout">Check-out Date :</label>
            <input type="date" name="checkout" id="checkout">

            <br><br>
            
            <label for="room">Room Type : </label>
            <select name="room" id="room">
                <option value="">Select Option</option>
                <option value="Single">Single Room</option>
                <option value="Double">Double Room</option>
            </select>
            
            <br><br>
            
            <label for="guests">No. of Guests :</label>
            <input type="number" name="guests" id="guests" placeholder="Enter number of Guests">

            <br><br>

            <label for="Req">Special Requests : </label>
            <br>
            <textarea cols="45" rows="4" name="Req" id="Req"></textarea>
            

            <br><br>

            <button>Submit Now</button>
            <button>Reset Form</button>
        </center>
    </fieldset>

</body>
</html>
